// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath 'com.google.gms:google-services:4.4.1' // plugin Firebase
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
